[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "architect"
version = "0.1.0"
description = "Run a coding model on 8 GB of RAM, no CUDA: the arithmetic and the measurements."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
architect = "architect.cli:main"

[tool.setuptools]
packages = ["architect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
